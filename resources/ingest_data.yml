# The mra-ingest-data job: one serverless notebook task that installs your model_risk_agent wheel,
# loads project_config.yml and and execustes documents ingestion from regulatory and academic sources.
# It runs as whoever deploys the bundle; the target's deploy principal does that from GitHub
# Actions. Its name ends with the target, so the three deployments never collide. The course's
# onboarding gives you CAN_MANAGE on the dev job and CAN_VIEW on the acc and prd jobs once they are
# deployed, so this public file names nobody.
resources:
  jobs:
    mra-ingest-data:
      name: job-mra-ingest-data-lennon-jcruz-${bundle.target}
      budget_policy_id: "af9e2850-ed3a-3d2d-9cd0-fe618692bb3f"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: ingest-data
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/ingest_data.py
            base_parameters:
              env: ${bundle.target}
